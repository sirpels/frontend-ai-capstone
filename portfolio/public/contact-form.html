<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Contact form definition</title></head>
  <body>
    <!-- Netlify scans built HTML for forms; the visible form is rendered by React. -->
    <form name="contact" method="POST" data-netlify="true">
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
